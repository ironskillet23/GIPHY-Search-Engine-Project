<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact | GIPHY Search Engine</title>

    <!-- Reuse the same stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- Navigation Bar -->
<nav class="navbar">

    <a href="index.html" class="logo">
        GIPHY Search Engine
    </a>

    <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="trending.html">Trending</a>
                <a href="contact.html">Contact</a>
    </div>

</nav>


    <!-- Contact Section -->
    <main>

        <section class="contact-section">

            <div class="contact-container">

                <h1>Contact Us</h1>

                <p class="contact-description">
                    Have a question or feedback?
                    Send us a message below.
                </p>


                <!-- Contact Form -->
                <form id="contactForm" novalidate>

                    <!-- Full Name -->
                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                        <p
                            class="error-message"
                            id="nameError"
                        ></p>

                    </div>


                    <!-- Email Address -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required
                        >

                        <p
                            class="error-message"
                            id="emailError"
                        ></p>

                    </div>


                    <!-- Message -->
                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            placeholder="Enter your message"
                            required
                        ></textarea>

                        <p
                            class="error-message"
                            id="messageError"
                        ></p>

                    </div>


                    <!-- Submit Button -->
                    <button
                        type="submit"
                        class="submit-button"
                    >
                        Submit
                    </button>


                    <!-- Success Message -->
                    <p
                        class="success-message"
                        id="successMessage"
                    ></p>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <div class="footer-content">

            <div class="footer-brand">

                <h3>GIPHY Search Engine</h3>

                <p>
                    &copy; 2026 GIPHY Search Engine.
                    All rights reserved.
                </p>

            </div>

            <ul class="footer-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="trending.html">Trending</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>

            </ul>

        </div>

    </footer>


    <!-- Contact Page JavaScript -->
    <script src="contact.js"></script>

</body>

</html>
