<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Perfect GIF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation Bar -->
<nav class="navbar">

    <a href="index.html" class="logo">
        GIPHY Search Engine
    </a>

    <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="trending.html">Trending</a>
                <a href="contact.html">Contact</a>
    </div>

</nav>


    <!-- Hero Section -->
    <main>

        <section class="hero" id="home">

            <h1>Discover Amazing GIFs</h1>

            <p>
                Search, discover, and explore GIFs for every
                mood, reaction, and moment.
            </p>

            <!-- Search Bar -->
            <div class="search-container">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search for GIFs..."
                    aria-label="Search for GIFs"
                >

                <button id="searchButton">
                    Search
                </button>

            </div>

        </section>


        <!-- Trending GIF Section -->
        <section class="trending" id="trending">

            <h2>Trending GIFs</h2>

            <!-- GIFs will be added here later -->
            <div
                class="gif-container"
                id="gifContainer">
            </div>

        </section>

    </main>

<!-- GIF Details Modal -->
<div class="modal" id="gifModal">

    <div class="modal-content">

        <!-- Close Button -->
        <button
            class="modal-close"
            id="modalClose"
            aria-label="Close modal"
        >
            &times;
        </button>

        <!-- Larger GIF Preview -->
        <img
            id="modalGif"
            class="modal-gif"
            src=""
            alt=""
        >

        <!-- GIF Title -->
        <h2 id="modalTitle"></h2>

        <!-- Modal Buttons -->
        <div class="modal-buttons">

            <button id="copyButton">
                Copy GIF URL
            </button>

            <a
                id="giphyLink"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                Open on GIPHY
            </a>

        </div>

        <!-- Copy confirmation -->
        <p id="copyMessage"></p>

    </div>

</div>

    <!-- Footer -->
    <footer id="contact">

        <div class="footer-content">

            <div class="footer-brand">

                <h3>GIPHY Search Engine</h3>

                <p>
                    &copy; 2026 GIPHY Search Engine.
                    All rights reserved.
                </p>

            </div>

            <ul class="footer-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="trending.html">Trending</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>

            </ul>

        </div>

    </footer>

    <script src="app.js"></script>
</body>
</html>
