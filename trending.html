<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trending GIFs | GIPHY Search Engine</title>

    <!-- Reuse the same stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- Navigation Bar -->
<nav class="navbar">

    <a href="index.html" class="logo">
        GIPHY Search Engine
    </a>

    <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="trending.html">Trending</a>
                <a href="contact.html">Contact</a>
    </div>

</nav>


    <!-- Main Content -->
    <main>

        <section class="trending">

            <h1>Trending GIFs</h1>

            <p class="page-description">
                Explore GIFs that are currently trending on GIPHY.
            </p>

            <!--
                Loading, error, and GIF content
                will be inserted here with JavaScript.
            -->
            <div
                class="gif-container"
                id="gifContainer"
            >
                <p>Loading GIFs...</p>
            </div>

        </section>

    </main>


<!-- =========================================
     GIF DETAILS MODAL
========================================= -->

<div
    id="gifModal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
>
    <div class="modal-content">

        <!-- Close Button -->
        <button
            id="modalClose"
            class="modal-close"
            type="button"
            aria-label="Close GIF details"
        >
            &times;
        </button>

        <!-- Selected GIF -->
        <img
            id="modalGif"
            class="modal-gif"
            src=""
            alt=""
        >

        <!-- Selected GIF Title -->
        <h2 id="modalTitle">
            GIF Title
        </h2>

        <!-- Modal Buttons -->
        <div class="modal-buttons">
            <button
                id="copyButton"
                type="button"
            >
                Copy GIF URL
            </button>

            <a
                id="giphyLink"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                View on GIPHY
            </a>
        </div>

        <!-- Copy Confirmation or Error Message -->
        <p
            id="copyMessage"
            aria-live="polite"
        ></p>

    </div>
</div>


    <!-- Footer -->
    <footer id="contact">

        <div class="footer-content">

            <div class="footer-brand">

                <h3>GIPHY Search Engine</h3>

                <p>
                    &copy; 2026 GIPHY Search Engine.
                    All rights reserved.
                </p>

            </div>


            <ul class="footer-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="trending.html">Trending</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>

            </ul>

        </div>

    </footer>


    <!-- Trending Page JavaScript -->
    <script src="trending.js"></script>

</body>

</html>
